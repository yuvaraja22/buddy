name: Buddy
options:
  bundleIdPrefix: com.yuvaraja
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  LLM:
    url: https://github.com/eastriverlee/LLM.swift.git
    exactVersion: 3.0.3

targets:
  Buddy:
    type: application
    platform: iOS
    sources:
      - path: Buddy
        excludes:
          - "Resources/Buddy.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuvaraja.buddy
        PRODUCT_NAME: Buddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Buddy/Resources/Buddy.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Buddy/Resources/Info.plist
      properties:
        CFBundleDisplayName: Buddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Buddy uses your microphone offline in the gym to transcribe and log your workout sets locally. Audio never leaves your iPhone."
        NSSpeechRecognitionUsageDescription: "Buddy uses Apple on-device speech recognition offline in the gym to transcribe your spoken workout sets locally. Audio never leaves your iPhone."
        ITSAppUsesNonExemptEncryption: false
        ALTAppGroups:
          - group.com.yuvaraja.buddy
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.yuvaraja.buddy
            CFBundleURLSchemes:
              - buddy
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: LLM
        product: LLM
      - target: BuddyWidgets
        embed: true

  BuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BuddyWidgets
        excludes:
          - "Resources/BuddyWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuvaraja.buddy.widgets
        PRODUCT_NAME: BuddyWidgets
        CODE_SIGN_ENTITLEMENTS: BuddyWidgets/Resources/BuddyWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: BuddyWidgets/Resources/Info.plist
      properties:
        CFBundleDisplayName: Buddy Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ALTAppGroups:
          - group.com.yuvaraja.buddy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuddyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuvaraja.buddy.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Buddy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Buddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Buddy

schemes:
  Buddy:
    build:
      targets:
        Buddy: all
        BuddyWidgets: all
        BuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BuddyTests
    archive:
      config: Release
